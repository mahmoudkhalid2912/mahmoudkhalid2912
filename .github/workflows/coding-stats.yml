name: Daily coding statistics

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-coding-stats
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'mahmoudkhalid2912/mahmoudkhalid2912'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Refresh public statistics
        run: python3 scripts/update_stats.py
      - name: Commit only profile statistics
        run: |
          git add -- README.md stats.json
          if git diff --cached --quiet; then
            echo 'No statistics changed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update public coding statistics'
          git push
